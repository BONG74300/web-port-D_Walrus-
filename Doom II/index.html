<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doom II</title>
    <style>
        body { background: #121212; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .game-card {
            position: relative; width: 360px; height: 200px; border-radius: 20px; overflow: hidden; cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .game-card:hover { transform: scale(1.06); box-shadow: 0 16px 30px rgba(0,0,0,0.6); }
        .game-card img { width: 100%; height: 100%; object-fit: cover; }
        .game-overlay {
            position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            display: flex; align-items: flex-end; padding: 20px; opacity: 0; transition: opacity 0.3s ease;
        }
        .game-card:hover .game-overlay { opacity: 1; }
        .game-title { color: #fff; margin: 0; font-family: sans-serif; font-size: 1.25rem; }
    </style>
</head>
<body>
    <div class="game-card">
        <img src="https://play-lh.googleusercontent.com/VrGId-TYaL82FXTvurH1zpHC7vwgDf0F_IexPjIiITD_oasfcESvec5kV-83WpsRrVCMNxjfTvDnpFFJBXHGWQ" alt="Game">
        <div class="game-overlay">
            <h3 class="game-title">Doom II</h3>
        </div>
    </div>
</body>
</html>
