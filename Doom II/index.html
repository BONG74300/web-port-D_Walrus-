<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doom II</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#121212;font-family:Arial,sans-serif}
#library{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;z-index:10}
.game-card{position:relative;width:360px;height:200px;border:0;padding:0;border-radius:20px;overflow:hidden;cursor:pointer;background:#222;color:white;box-shadow:0 8px 20px rgba(0,0,0,.4);transition:.3s}
.game-card:hover{transform:scale(1.06)}.game-card img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.game-overlay{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.85),transparent);display:flex;align-items:flex-end;padding:20px}.game-title{margin:0;font-size:1.5rem}
#game{display:none;position:fixed;inset:0;background:#000;z-index:1}#game.active{display:block}
#canvas{width:100%;height:100%;display:block;background:#000;outline:none}
#loading{position:absolute;inset:0;z-index:20;display:grid;place-items:center;color:#fff;background:#000;font-size:20px;text-align:center;padding:20px}#loading.hidden{display:none}
</style>
</head>
<body>
<div id="library">
<button class="game-card" id="play" type="button" onclick="window.startDoom && window.startDoom()">
<img src="https://play-lh.googleusercontent.com/VrGId-TYaL82FXTvurH1zpHC7vwgDf0F_IexPjIiITD_oasfcESvec5kV-83WpsRrVCMNxjfTvDnpFFJBXHGWQ" alt="Doom II">
<div class="game-overlay"><h3 class="game-title">Doom II — Click to Play</h3></div>
</button>
</div>
<div id="game"><div id="loading">Loading Doom II…</div><canvas id="canvas" tabindex="0"></canvas></div>
<script src="./launcher.js"></script>
</body>
</html>
