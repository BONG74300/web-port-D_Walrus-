<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doom II Web Port</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#101010;color:#fff;font-family:system-ui,sans-serif}
#library{min-height:100%;display:grid;place-items:center}
.card{width:320px;background:#1c1c1c;border:1px solid #444;border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;color:inherit}
.cover{height:380px;display:grid;place-items:center;background:radial-gradient(circle,#5a1c12,#090909)}
.cover h1{font-size:52px;letter-spacing:5px;text-shadow:3px 3px #000;margin:0}
.info{padding:18px}.info h2{margin:0}.info p{margin:6px 0 0;color:#aaa}
#game{display:none;position:fixed;inset:0;background:#000}
#game.active{display:block}canvas{width:100%;height:100%;display:block;outline:none}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:#000;z-index:2}
#loading.hidden{display:none}
</style>
</head>
<body>
<main id="library"><button class="card" id="play" aria-label="Play Doom II"><div class="cover"><h1>DOOM II</h1></div><div class="info"><h2>DOOM II</h2><p>Click to play in your browser</p></div></button></main>
<section id="game"><div id="loading">Loading game engine…</div><canvas id="canvas" tabindex="0"></canvas></section>
<script src="launcher.js"></script>
</body>
</html>
