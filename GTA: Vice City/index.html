<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTA: Vice City — Web Port</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#101014;color:#fff;font-family:Arial,sans-serif}
#library{min-height:100%;display:grid;place-items:center}.card{width:min(420px,90vw);height:240px;border:1px solid #444;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#ff5a36,#44209b 55%,#111);color:#fff;cursor:pointer;text-align:left;padding:24px;box-shadow:0 18px 50px #0008;transition:.2s}
.card:hover{transform:translateY(-6px) scale(1.01)}.card h1{font-size:38px;margin:95px 0 0;text-shadow:2px 2px #000}.card p{margin:6px 0;color:#eee}
#game{display:none;position:fixed;inset:0;background:#000}#game.active{display:block}#canvas{width:100%;height:100%;display:block;outline:none}
#loading{position:absolute;inset:0;z-index:5;display:grid;place-items:center;text-align:center;padding:24px;background:#000;font-size:18px}.hidden{display:none!important}
</style>
</head><body>
<main id="library"><button class="card" id="play" type="button"><h1>GTA: VICE CITY</h1><p>Click to play in your browser</p></button></main>
<section id="game"><div id="loading">Loading Vice City WebAssembly…</div><canvas id="canvas" tabindex="0"></canvas></section>
<script src="./launcher.js"></script>
</body></html>
